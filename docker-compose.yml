version: '3.8'
services:
  deepsproxy:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - API_KEY=${API_KEY:-sua_api_key_aqui}
      - PLAYWRIGHT_HEADLESS=${PLAYWRIGHT_HEADLESS:-true}
      - PLAYWRIGHT_TIMEOUT=${PLAYWRIGHT_TIMEOUT:-30000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./deepseek_profile:/app/deepseek_profile
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
